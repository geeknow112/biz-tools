name: Tweet with Playwright

on:
  workflow_dispatch:
    inputs:
      tweet_content:
        description: '投稿内容'
        required: true
        type: string

jobs:
  tweet:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install dependencies
        working-directory: ./scripts
        run: npm install
      
      - name: Install Playwright browsers
        working-directory: ./scripts
        run: npx playwright install chromium --with-deps
      
      - name: Restore X cookies
        run: |
          echo '${{ secrets.X_COOKIES_JSON }}' > ./scripts/x-cookies.json
      
      - name: Post tweet
        working-directory: ./scripts
        run: node tweet-playwright.js "${{ github.event.inputs.tweet_content }}"
      
      - name: Save updated cookies
        if: always()
        run: |
          if [ -f ./scripts/x-cookies.json ]; then
            echo "Cookie file exists. Note: To update secrets, manually copy the new cookies."
          fi
